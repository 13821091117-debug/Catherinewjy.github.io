<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Drawings | Catherine Wang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --accent-color: #ffffff;
            --text-dim: #888;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%;
            background-color: var(--bg-deep);
            color: #eee;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* 防止双滚动条 */
        }

        /* 顶部导航条 */
        .nav-header {
            height: 60px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            border-bottom: 1px solid #222;
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .back-btn:hover { opacity: 0.7; }

        .project-title {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* PDF 容器 */
        .pdf-viewer-container {
            width: 100%;
            height: calc(100vh - 60px); /* 减去顶部导航高度 */
            background: #1a1a1a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 加载提示 */
        .loading-overlay {
            position: absolute;
            top: 60px; left: 0; width: 100%; height: 100%;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .project-title { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="nav-header">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> BACK TO PORTFOLIO
        </a>
        <div class="project-title" id="displayTitle">Loading Project...</div>
        <div style="width: 100px;"></div> </div>

    <div class="loading-overlay" id="loader">
        <div style="text-align: center;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
            <p style="font-size: 12px; color: #888;">正在加载 PDF 图纸...</p>
        </div>
    </div>

    <div class="pdf-viewer-container">
        <iframe id="pdfFrame" src="" onload="hideLoader()"></iframe>
    </div>

    <script>
        // 项目名称映射（与 index.html 保持一致）
        const projectData = [
            { name: "作品 01: 珞珈小筑", file: "static/drawings/p1.pdf" },
            { name: "作品 02: Aura Haven", file: "static/drawings/p2.pdf" },
            { name: "作品 03: House+", file: "static/drawings/p3.pdf" },
            { name: "作品 04: 潮间聚落", file: "static/drawings/p4.pdf" }
        ];

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        window.onload = function() {
            // 解析 URL 参数 ?id=X
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id'));

            const titleEl = document.getElementById('displayTitle');
            const frameEl = document.getElementById('pdfFrame');

            if (!isNaN(id) && projectData[id]) {
                // 设置标题
                titleEl.innerText = projectData[id].name.toUpperCase();
                // 设置 PDF 路径
                frameEl.src = projectData[id].file;
            } else {
                titleEl.innerText = "PROJECT NOT FOUND";
                document.getElementById('loader').innerHTML = "<p>未找到对应图纸，请返回主页重新尝试。</p>";
            }
            
            // 如果 10 秒后还没加载完（可能是路径错或打不开），允许手动关闭 loader
            setTimeout(hideLoader, 10000);
        };
    </script>
</body>
</html>
